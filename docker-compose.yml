services:
  postgres:
    image: postgres:17-alpine
    container_name: go-quest-postgres
    environment:
      POSTGRES_USER: goquest
      POSTGRES_PASSWORD: goquest
      POSTGRES_DB: goquest
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goquest -d goquest"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      target: development
    container_name: go-quest-api
    environment:
      APP_ENV: development
      API_PORT: "8080"
      CORS_ALLOWED_ORIGIN: http://localhost:5173
      DATABASE_URL: postgres://goquest:goquest@postgres:5432/goquest?sslmode=disable
      MIGRATIONS_DIR: migrations
      CODE_RUNNER_ENABLED: "true"
      RUNNER_URL: http://runner:8090
      MAX_SOURCE_BYTES: "20000"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      runner:
        condition: service_started
    volumes:
      - ./apps/api:/app
    security_opt:
      - no-new-privileges:true

  runner:
    build:
      context: ./apps/runner
      target: development
    container_name: go-quest-runner
    environment:
      RUNNER_PORT: "8090"
      RUNNER_TIMEOUT_MS: "5000"
      RUNNER_MAX_SOURCE_BYTES: "20000"
      RUNNER_MAX_OUTPUT_BYTES: "20000"
      GOCACHE: /tmp/go-build-cache
      GOMODCACHE: /tmp/go-mod-cache
    ports:
      - "8090:8090"
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777,exec
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: ./apps/web
      target: development
    container_name: go-quest-web
    environment:
      VITE_API_BASE_URL: http://localhost:8080
    ports:
      - "5173:5173"
    depends_on:
      - api
    volumes:
      - ./apps/web:/app
      - web-node-modules:/app/node_modules
    security_opt:
      - no-new-privileges:true

volumes:
  postgres-data:
  web-node-modules:
